# Render.com Blueprint for the v1 static site (SPEC §5).
# Deploy via Render dashboard: New + → Blueprint → select this repository.

services:
  - type: web
    name: aquarium-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false

    # Hashed asset filenames allow immutable long-term caching.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache

    # SPA fallback: serve the app on any path.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
